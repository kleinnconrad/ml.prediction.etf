name: 'Pipeline: 1. Update Seed'

on:
  schedule:
    # Sunday 04:41 UTC: the next Saturday batch run uses the refreshed target list
    - cron: '41 4 * * 0'
  workflow_dispatch:
    # Also triggered manually from the GitHub Actions tab

jobs:
  update-etf-seed:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: 'pyproject.toml'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install requests beautifulsoup4

      - name: Download Xetra T7 Dump
        run: python scripts/download_t7_dump.py

      - name: Parse Xetra dump and generate Seed List
        run: python scripts/generate_seed.py

      - name: Screen Liquidity and Build ETF Batch
        run: python scripts/build_etf_batch.py

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update ETF batch targets and seed list from Xetra"
          branch: main
          file_pattern: "config/*"
