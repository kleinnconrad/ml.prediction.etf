name: 'Pipeline: 2. Run Batch'

on:
  workflow_dispatch:

permissions:
  contents: write

# One batch run at a time
concurrency:
  group: run-batch
  cancel-in-progress: false

jobs:
  run-batch:
    runs-on: ubuntu-latest
    # The limit stops a hanging download
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.17"
          enable-cache: true

      # One pooled model for all target ETFs: downloads the prices, validates, fits and
      # ranks, and writes artifacts/latest_batch_results.json
      - name: Run the pooled model
        run: uv run --locked python src/main.py

      - name: Commit the batch results
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/latest_batch_results.json
          git commit -m "chore: update batch results [skip ci]" || echo "No changes to commit"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
